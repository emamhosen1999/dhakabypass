<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 156" role="img" aria-labelledby="dbedc-mark-title">
  <title id="dbedc-mark-title">DBEDC</title>
  <!--
    DBEDC mark, redrawn as vector geometry from public/logo.webp (215x204).
    Colours sampled from that file: ring #1172BA, wedge #EF8221.

    THIS IS A REDRAW, NOT A VECTORISATION. No tracing tool was available, and
    the only source is a 215px raster, so the curvature of the ring and the two
    inner wings approximates the official artwork rather than reproducing it.
    Check against DBEDC's official brand file before this becomes the canonical
    logo (header, favicon, JSON-LD, media kit).

    Mark only, deliberately: the wordmark stays live text in the header so it
    can be translated, sized and read by assistive tech. Do not bake type in.

    The ring uses currentColor so one file serves both grounds. Measured:
    DBEDC blue #1172BA on the dark plate #06263D is only 3.06:1 and the mark
    nearly vanishes. So set color:#1172BA on light surfaces, and on the dark
    header set color to the plate foreground token (db-plate-fg). The wedge
    stays #EF8221, which holds at 5.83:1 on the plate and 3.4:1 on white.
  -->
  <g fill="currentColor">
    <!-- Outer ring: outer ellipse minus inner ellipse -->
    <path fill-rule="evenodd" d="
      M 106 0
      A 106 74 0 1 1 105.99 0
      Z
      M 106 8
      A 80 68 0 1 0 106.01 8
      Z
    "/>
    <!-- Left inner wing -->
    <path d="
      M 100 24
      C 92 44 88 60 84 72
      C 80 86 76 96 72 108
      L 38 108
      C 44 88 54 66 68 46
      C 76 34 90 26 100 24
      Z
    "/>
    <!-- Right inner wing (mirror) -->
    <path transform="translate(212,0) scale(-1,1)" d="
      M 100 24
      C 92 44 88 60 84 72
      C 80 86 76 96 72 108
      L 38 108
      C 44 88 54 66 68 46
      C 76 34 90 26 100 24
      Z
    "/>
  </g>
  <!-- Central wedge -->
  <path fill="#EF8221" d="
    M 98 18
    L 114 18
    C 122 58 129 108 133 152
    L 79 152
    C 83 108 90 58 98 18
    Z
  "/>
</svg>
