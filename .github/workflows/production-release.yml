name: Build production release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: local-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: local-ci-only
      DB_NAME: dhakabypass
      DB_NAME_TEST: dhakabypass_test
      SITE_URL: https://dhakabypass.com
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Prepare isolated build database
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed:all
          node scripts/import-legacy-media.mjs
          node scripts/translate-media-alt.mjs
          node scripts/import-corridor-geometry.mjs --source osm --file public/maps/corridor-alignment.geojson
      - run: npm test
      - run: npm run build
      - name: Publish Linux artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run deploy:release -- --target=production --yes
