name: Build production release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: local-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: local-ci-only
      DB_NAME: dhakabypass
      DB_NAME_TEST: dhakabypass_test
      SITE_URL: https://dhakabypass.com
      # Analytics is baked in at build time, exactly as SITE_URL is: the
      # localised pages are prerendered, so the tag is written into the HTML
      # here and not decided by the running app. Choosing ga4 also switches on
      # the consent banner, with every storage type denied until a visitor
      # agrees.
      #
      # The measurement ID is not a secret — it is published in the HTML of
      # every page — so it lives here rather than in a repository secret,
      # where the artifact's provenance is readable beside the rest of the
      # build. It is the "Website" stream of the Dhaka Bypass Expressway
      # property, created 19 September 2026.
      ANALYTICS_PROVIDER: ga4
      ANALYTICS_SITE_ID: G-L6DWRP79H5
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Prepare isolated build database
        run: |
          npm run db:migrate
          npm run db:seed
          npm run db:seed:all
          node scripts/import-legacy-media.mjs
          node scripts/translate-media-alt.mjs
          node scripts/apply-content-recovery.mjs
          node scripts/import-corridor-geometry.mjs --source osm --file public/maps/corridor-alignment.geojson
      # Split so a red X says WHICH kind of failure it was (C-D20). The unit
      # suite needs nothing but the checkout; tests/db/** needs the MariaDB
      # service above and the database prepared by the step before this one.
      # Run as one step and a service that failed to come up looks identical
      # to a broken assertion.
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:db
      - run: node scripts/verify-release-sql.mjs --database=dhakabypass_sql_test
      - run: npm run build
      - name: Start the packaged server and request real pages
        # Against the database verify-release-sql built from every db/sql file,
        # so the migration ledger is complete, as it is in production.
        env:
          DB_NAME: dhakabypass_sql_test
        run: node scripts/smoke-standalone.mjs
      - name: Publish Linux artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm run deploy:release -- --target=production --yes
